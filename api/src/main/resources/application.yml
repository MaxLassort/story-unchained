spring:
  application:
    name: story-unchained-api
  datasource:
    url: jdbc:h2:file:${user.home}/.luniiUnchained/db/studio_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 9090

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger
    enabled: true
