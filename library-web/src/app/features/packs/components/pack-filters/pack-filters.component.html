<mat-chip-listbox class="filters__chips" multiple aria-label="Pack filters">
  <mat-chip-option [selected]="showOfficial()" (selectionChange)="showOfficial.set($event.selected)">
    Official
  </mat-chip-option>
  <mat-chip-option [selected]="showFrFr()" (selectionChange)="showFrFr.set($event.selected)" class="filters__chip--lang">
    French only
  </mat-chip-option>
</mat-chip-listbox>

<div class="filters__age" role="group" aria-label="Age range filter">
  <div class="filters__age-slider">
    <span class="filters__age-label">Min {{ ageMin() ?? '–' }}</span>
    <mat-slider class="filters__slider" [min]="AGE_MIN" [max]="AGE_MAX" step="1" discrete>
      <input matSliderThumb [value]="ageMin() ?? AGE_MIN" (valueChange)="setAgeMin($event)" aria-label="Minimum age" />
    </mat-slider>
  </div>
  <div class="filters__age-slider">
    <span class="filters__age-label">Max {{ ageMax() ?? '–' }}</span>
    <mat-slider class="filters__slider" [min]="AGE_MIN" [max]="AGE_MAX" step="1" discrete>
      <input matSliderThumb [value]="ageMax() ?? AGE_MAX" (valueChange)="setAgeMax($event)" aria-label="Maximum age" />
    </mat-slider>
  </div>
  @if (hasAgeFilter()) {
    <button
      mat-icon-button
      matTooltip="Clear age filter"
      (click)="clearAgeFilter()"
      aria-label="Clear age filter"
    >
      <mat-icon>restart_alt</mat-icon>
    </button>
  }
</div>

<mat-chip
  class="filters__sort"
  role="button"
  tabindex="0"
  (click)="toggleSort()"
  (keydown.enter)="toggleSort()"
  (keydown.space)="toggleSort()"
  [attr.aria-label]="sortOrder() === 'asc' ? 'Sort ascending' : 'Sort descending'"
>
  <mat-icon>sort</mat-icon>
  Sort by: {{ sortOrder() === 'asc' ? 'Title A-Z' : 'Title Z-A' }}
</mat-chip>
