<div class="story-creation">
  <a class="story-creation__back" mat-button routerLink="/packs">
    <mat-icon aria-hidden="true">arrow_back</mat-icon>
    Library
  </a>

  <h1 class="story-creation__title">Create a story</h1>
  <p class="story-creation__subtitle">
    Compose your own story: title, covers, chapters, audio and images — the app will build a
    playable Lunii pack.
  </p>

  <mat-stepper #stepper class="story-creation__stepper" [linear]="true" [disableRipple]="true">
    <mat-step label="General Info" [completed]="detailsStep()?.complete() ?? false">
      <mat-card class="step-card">
        <mat-card-content>
          <app-story-details-step />
        </mat-card-content>
      </mat-card>

      <div class="step-actions">
        <button mat-button type="button" (click)="cancel()">Cancel</button>
        <button
          mat-flat-button
          type="button"
          color="primary"
          matStepperNext
          [disabled]="!detailsStep()?.complete()"
        >
          Next: Visuals
          <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Visuals">
      <mat-card class="step-card">
        <mat-card-content class="step-card__placeholder">
          <mat-icon aria-hidden="true">image</mat-icon>
          <p>Visuals step coming soon.</p>
        </mat-card-content>
      </mat-card>

      <div class="step-actions">
        <button mat-button type="button" matStepperPrevious>Back</button>
        <button mat-flat-button type="button" color="primary" matStepperNext>
          Next: Chapters
          <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Chapters">
      <mat-card class="step-card">
        <mat-card-content class="step-card__placeholder">
          <mat-icon aria-hidden="true">library_books</mat-icon>
          <p>Chapters step coming soon.</p>
        </mat-card-content>
      </mat-card>

      <div class="step-actions">
        <button mat-button type="button" matStepperPrevious>Back</button>
        <button mat-flat-button type="button" color="primary" matStepperNext>
          Next: Finalize
          <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <mat-step label="Finalize">
      <mat-card class="step-card">
        <mat-card-content class="step-card__placeholder">
          <mat-icon aria-hidden="true">check_circle</mat-icon>
          <p>Finalize step coming soon.</p>
        </mat-card-content>
      </mat-card>

      <div class="step-actions">
        <button mat-button type="button" matStepperPrevious>Back</button>
        <button mat-flat-button type="button" color="primary" matStepperNext>
          Create the pack
          <mat-icon aria-hidden="true">auto_stories</mat-icon>
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
