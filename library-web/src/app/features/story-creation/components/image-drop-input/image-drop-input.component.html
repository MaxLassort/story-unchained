<div class="image-drop">
  <div
    class="image-drop__zone"
    tabindex="0"
    role="button"
    aria-label="Select image"
    [class.image-drop__zone--dragging]="dragging()"
    (click)="fileInput.click()"
    (keydown.enter)="fileInput.click()"
    (keydown.space)="$event.preventDefault(); fileInput.click()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    @if (previewUrl(); as url) {
      <img [src]="url" alt="" class="image-drop__preview" />
      <span class="image-drop__file-name">{{ fileName() }}</span>
      <span class="image-drop__replace">Click or drop to replace</span>
      <button
        mat-icon-button
        type="button"
        class="image-drop__remove"
        aria-label="Remove image"
        (click)="clearFile(); $event.stopPropagation()"
      >
        <mat-icon>delete</mat-icon>
      </button>
    } @else {
      <mat-icon class="image-drop__icon">upload</mat-icon>
      <span class="image-drop__title">{{ title() }}</span>
      <span class="image-drop__hint">{{ hint() }}</span>
    }
    <input
      #fileInput
      class="image-drop__input"
      type="file"
      accept="image/png,image/jpeg"
      (change)="onFileSelected(fileInput.files?.[0] ?? null); fileInput.value = ''"
    />
  </div>
  @if (typeError(); as error) {
    <span class="image-drop__error">{{ error }}</span>
  }
</div>
